on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-x86:
    name: x86/${{ matrix.c_compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            c_compiler: clang-cl
            cpp_compiler: clang-cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-24.04
            c_compiler: clang-23
            cpp_compiler: clang++-23

    steps:
    - uses: actions/checkout@v4

    - name: Test Arm toolchain archive verification
      if: matrix.c_compiler == 'gcc'
      run: bash src_tests/toolchain/archive_checksum.sh

    - name: Add the LLVM 23 package source
      if: matrix.c_compiler == 'clang-23'
      run: |
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/uni-hal-llvm.gpg
        echo 'deb [signed-by=/etc/apt/keyrings/uni-hal-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/uni-hal-llvm23.list

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev ${{ matrix.c_compiler == 'clang-23' && 'clang-23' || '' }}

    - name: Install Npcap on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri 'https://npcap.com/dist/npcap-sdk-1.15.zip' -OutFile 'npcap-sdk.zip'
        Expand-Archive -Path '.\npcap-sdk.zip' -DestinationPath 'C:\npcap-sdk'

    - name: Set up the MSVC tools and Windows SDK
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Use the clang-cl bundled with Visual Studio
      if: matrix.c_compiler == 'clang-cl'
      shell: pwsh
      run: |
        # Match the MSVC standard library rather than using the standalone LLVM on PATH.
        $clangBin = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
        & (Join-Path $clangBin 'clang-cl.exe') --version
        $clangBin >> $env:GITHUB_PATH

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        ${{ runner.os == 'Windows' && '-G Ninja' || '' }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain.cmake
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -DUNI_HAL_TARGET_MCU=PC
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config Release --output-on-failure --no-tests=error

  build-arm-gcc:
    name: arm/gcc (${{ matrix.mcu }}, CAN FD ${{ matrix.can_fd }}${{ matrix.static_allocation == 'OFF' && ', dynamic allocation only' || '' }}${{ matrix.tick_hz == 128 && ', tickless 128 Hz' || '' }}) on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcu: [STM32H743, STM32H753, STM32L496]
        can_fd: ["OFF"]
        static_allocation: ["ON"]
        tick_hz: [1000]
        build_type: [Release]
        include:
          - mcu: STM32H743
            can_fd: "ON"
            static_allocation: "ON"
            build_type: Release
          - mcu: STM32L496
            can_fd: "OFF"
            static_allocation: "OFF"
            build_type: Release
          - mcu: STM32L496
            can_fd: "OFF"
            static_allocation: "ON"
            tick_hz: 128
            build_type: Release

    steps:
    - uses: actions/checkout@v4

    - name: Install GNU Arm Embedded Toolchain
      shell: bash
      run: >-
        bash .github/scripts/install-arm-toolchain.sh
        https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
        62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823

    - name: Install Cortex-M emulator
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build-${{ matrix.mcu }}-${{ matrix.can_fd }}-${{ matrix.static_allocation }}-${{ matrix.tick_hz || 1000 }}" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain.cmake
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DUNI_HAL_TARGET_MCU=${{ matrix.mcu }}
        -DUNI_HAL_HSE_VALUE=8000000
        -DUNI_HAL_CAN_USE_FD=${{ matrix.can_fd }}
        ${{ matrix.static_allocation == 'OFF' && format('-DUNI_HAL_RTOS_CONFIG_EXTRA={0}/src_tests/config/freertos_dynamic_only.h', github.workspace) || '' }}
        ${{ matrix.tick_hz == 128 && format('-DUNI_HAL_RTOS_CONFIG_EXTRA={0}/src_tests/config/freertos_tick_128hz.h', github.workspace) || '' }}
        -DUNI_HAL_TEST_STM32_QEMU=ON
        ${{ matrix.mcu == 'STM32L496' && '-DUNI_HAL_TEST_ALLOCATOR_QEMU=ON' || '' }}
        -S ${{ github.workspace }}/src_tests/allocator

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Run the STM32 firmware regressions in QEMU
      run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure --no-tests=error

    - name: Build the documented STM32H7 application
      if: startsWith(matrix.mcu, 'STM32H7') && matrix.can_fd == 'OFF'
      shell: bash
      run: |
        app="$RUNNER_TEMP/stm32h7-application"
        cp -R src_tests/cmake_consumer "$app"
        ln -s "$PWD" "$app/Uni.HAL"
        cd "$app"
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=Uni.HAL/cmake/toolchain.cmake \
          -DUNI_HAL_TARGET_MCU=${{ matrix.mcu }} -DUNI_HAL_HSE_VALUE=8000000
        cmake --build build --config Release
        arm-none-eabi-readelf -h build/firmware.elf | grep -E 'Machine:[[:space:]]+ARM'
        test -s build/firmware.bin

        echo 'uni_hal_generate_rcc_map(firmware main.c)' >> CMakeLists.txt
        cmake --build build --config Release
        test -s build/rcc_map/firmware/rcc_map.dot

    - name: Check Debug and Release firmware artifacts in one build tree
      if: matrix.mcu == 'STM32L496' && matrix.static_allocation == 'ON' && matrix.tick_hz == 1000
      shell: bash
      run: |
        build_dir="$RUNNER_TEMP/allocator-multi"
        cmake -S src_tests/allocator -B "$build_dir" -G "Ninja Multi-Config" \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain.cmake" \
          -DUNI_HAL_TARGET_MCU=STM32L496 -DUNI_HAL_HSE_VALUE=8000000
        for config in Debug Release; do
          cmake --build "$build_dir" --config "$config" --target allocator_regression
        done
        for config in Debug Release; do
          test -s "$build_dir/$config/allocator_regression.elf"
          test -s "$build_dir/$config/allocator_regression.bin"
          test -s "$build_dir/$config/allocator.map"
        done

  build-zynq-consumer:
    if: github.event_name == 'push' && vars.UNI_HAL_ZYNQ7000_RUNNER != ''
    runs-on: [self-hosted, linux, "${{ vars.UNI_HAL_ZYNQ7000_RUNNER }}"]
    steps:
    - uses: actions/checkout@v4
    - name: Link the public API client against the board BSP
      run: |
        cmake -S src_tests/allocator -B build-zynq \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain.cmake" -DCMAKE_BUILD_TYPE=Release \
          -DUNI_HAL_TARGET_MCU=ZYNQ7000 -DUNI_HAL_ZYNQ7000_BSP_DIR="$UNI_HAL_ZYNQ7000_BSP_DIR" -DUNI_HAL_TEST_ZYNQ_QEMU=ON
        cmake --build build-zynq
        ctest --test-dir build-zynq --output-on-failure --no-tests=error

  build-arm-clang:
    name: arm/clang (${{ matrix.mcu }}) on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcu: [STM32H743, STM32H753, STM32L496]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM Embedded Toolchain for Arm
      shell: bash
      run: >-
        bash .github/scripts/install-arm-toolchain.sh
        https://github.com/ARM-software/LLVM-embedded-toolchain-for-Arm/releases/download/release-19.1.5/LLVM-ET-Arm-19.1.5-Linux-x86_64.tar.xz
        34ee877aadc78c5e9f067e603a1bc9745ed93ca7ae5dbfc9b4406508dc153920

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build-clang-${{ matrix.mcu }}" >> "$GITHUB_OUTPUT"

    - name: Install Cortex-M emulator
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain.cmake
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DUNI_HAL_TARGET_MCU=${{ matrix.mcu }}
        -DUNI_HAL_HSE_VALUE=8000000
        -DUNI_HAL_TEST_STM32_QEMU=ON
        ${{ matrix.mcu == 'STM32L496' && '-DUNI_HAL_TEST_ALLOCATOR_QEMU=ON' || '' }}
        -S ${{ github.workspace }}/src_tests/allocator

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Run the STM32 firmware regressions in QEMU
      run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure --no-tests=error
